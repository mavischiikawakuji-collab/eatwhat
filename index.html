<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}body{margin:0;background:#FFF7F3;color:#5A3D32;font-family:-apple-system,BlinkMacSystemFont,"SF Pro TC",sans-serif;min-height:100vh;padding:0 0 40px;overflow-x:clip}
.wrap{padding:0 16px}
.header{display:flex;justify-content:space-between;padding:20px 0 14px}
.h1{font-size:28px;font-weight:900} .h1 small{display:block;font-size:11px;color:#FF9A76;letter-spacing:2px;margin-top:4px}
.illust{width:68px;height:68px;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(255,154,118,.2)} .illust img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.stat{background:rgba(255,255,255,.9);border:1px solid #FFD9C8;border-radius:18px;padding:14px} .stat b{font-size:20px;display:block} .stat i{font-style:normal;font-size:11px;color:#A88B80}
.card{background:#FFF;border:1px solid #FFD9C8;border-radius:22px;padding:18px;box-shadow:0 4px 20px rgba(255,154,118,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:120px}
.cell{border-radius:16px;padding:14px 10px;text-align:center;font-weight:800;font-size:14px;position:relative;transition:all .18s;min-height:56px;display:grid;place-items:center;word-break:break-all;border:1.5px solid transparent}
.cell.active{transform:scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:1;filter:brightness(0.92);border-color:#5A3D32 !important}
.cell.winner{transform:scale(1.08);box-shadow:0 10px 28px rgba(0,0,0,.18);animation:pop .4s cubic-bezier(.34,1.56,.64,1);background:#5A3D32 !important;color:#FFF !important;border-color:#5A3D32 !important}
@keyframes pop{0%{transform:scale(1.06)}50%{transform:scale(1.15)}100%{transform:scale(1.08)}}
.result{margin-top:16px;text-align:center;min-height:44px} .result b{font-size:24px;display:block} .result i{font-style:normal;font-size:12px;color:#A88B80}
.btn{width:100%;margin-top:12px;background:linear-gradient(135deg,#FF9A76,#E87E5A);color:#FFF;font-weight:700;border:0;border-radius:14px;padding:14px;font-size:15px;box-shadow:0 6px 18px rgba(255,154,118,.28)}
.btn:disabled{opacity:.5}
.input{width:100%;background:#FFFBF8;border:1.5px solid #FFD9C8;border-radius:12px;padding:12px;font-size:14px;outline:none}
.list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.item{background:#FFF;border:1px solid #FFD9C8;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.icon-btns{display:flex;gap:6px} .icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid #FFD9C8;background:#FFF;display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .chip{padding:6px 12px;border-radius:99px;font-size:11px;background:#FFF;border:1px solid #FFD9C8;color:#8B6E64}
.footer{margin-top:24px;text-align:center;color:#A88B80;font-size:11px;background:rgba(255,255,255,.7);border:1px solid #FFD9C8;border-radius:14px;padding:12px}
.tbtn{font-size:11px;padding:6px 12px;border-radius:99px;border:1px solid #FFD9C8;background:#FFF;color:#8B6E64}
.lights{display:flex;gap:6px;justify-content:center;margin:10px 0 6px} .dot{width:8px;height:8px;border-radius:50%;background:#FFE4D6;transition:all .15s} .dot.on{background:#FF9A76;box-shadow:0 0 8px #FF9A76}
</style>
</head>

<div class="stats"><div class="stat"><b id="count">0 間</b><i>餐廳收藏</i></div><div class="stat"><b id="lastPick">未轉過</b><i>上次揀</i></div></div>
<div class="card">
<div class="lights" id="lights"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="grid" id="grid"><div style="grid-column:1/3;color:#A88B80;font-size:13px;text-align:center;padding:30px 0">未有餐廳，新增幾間先</div></div>
<div class="result" id="result"><i>已清空，新增幾間先跳得</i></div>
<button id="spin" class="btn">🎲 跳一跳</button>
<div style="display:flex;gap:8px;margin-top:10px"><input id="name" class="input" placeholder="例如：壽司郎 / 車仔麵"><button id="add" class="tbtn" style="flex-shrink:0;padding:0 18px">新增</button></div>
<div class="chips"><span class="chip" onclick="quickAdd('茶餐廳')">茶餐廳</span><span class="chip" onclick="quickAdd('日式')">日式</span><span class="chip" onclick="quickAdd('泰式')">泰式</span><span class="chip" onclick="quickAdd('火鍋')">火鍋</span><span class="chip" onclick="quickAdd('輕食')">輕食</span></div>
</div>
<div class="list" id="list"></div>
<div class="footer"><div>🔒 自動本地儲存 · restaurant_roulette_v1 · 0.3秒</div><div id="last">最後儲存: 3:52:51 PM</div><div style="margin-top:8px;display:flex;gap:6px;justify-content:center"><button class="tbtn" id="export">匯出</button><button class="tbtn" id="import">匯入</button><button class="tbtn" id="clear">清空</button><input type="file" id="file" accept="application/json" style="display:none"></div></div>
</div>
<script>
const KEY='restaurant_roulette_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"last":null}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('last').textContent='最後儲存: '+new Date().toLocaleTimeString();}
setInterval(save,300);
document.addEventListener('gesturestart',e=>e.preventDefault());
const $=id=>document.getElementById(id);
window.quickAdd=t=>{$('name').value=t;};
let jumping=false;
const cellColors=[
  {bg:'#FFE8D6', border:'#FFD5B5'},
  {bg:'#D6EAF8', border:'#B8DAF0'},
  {bg:'#D5F5E0', border:'#B8E9C6'},
  {bg:'#FCF3CF', border:'#F9E79F'},
  {bg:'#E8DAEF', border:'#D2B4DE'},
  {bg:'#FADBD8', border:'#F5B7B1'},
  {bg:'#D9F2D0', border:'#B7E6A8'},
  {bg:'#FDEBD0', border:'#FAD7A0'},
];
function renderGrid(highlightIdx=-1,winnerIdx=-1){
  const grid=$('grid');grid.innerHTML='';
  if(data.items.length===0){grid.innerHTML='<div style="grid-column:1/3;color:#A88B80;font-size:13px;text-align:center;padding:30px 0">未有餐廳，新增幾間先</div>';return;}
  data.items.forEach((name,i)=>{
    const d=document.createElement('div');d.className='cell';
    const col=cellColors[i % cellColors.length];
    d.style.background=col.bg;
    d.style.borderColor=col.border;
    if(i===winnerIdx){d.classList.add('winner');}
    else if(i===highlightIdx){d.classList.add('active');}
    d.textContent=name;
    grid.appendChild(d);
  });
  const dots=document.querySelectorAll('.dot');
  dots.forEach((dot,idx)=>{dot.classList.toggle('on', highlightIdx!==-1 && idx===highlightIdx % dots.length);});
}
function renderList(){
  const list=$('list');list.innerHTML='';
  data.items.forEach((it,idx)=>{
    const d=document.createElement('div');d.className='item';
    const name=document.createElement('span');name.style.fontWeight='700';name.style.fontSize='14px';name.textContent=it;
    const btns=document.createElement('div');btns.className='icon-btns';
    const edit=document.createElement('button');edit.className='icon-btn';edit.textContent='✏️';
    edit.onclick=()=>{const nv=prompt('改名',it);if(nv){data.items[idx]=nv.trim();save();render();}};
    const del=document.createElement('button');del.className='icon-btn';del.textContent='🗑️';
    del.onclick=()=>{data.items.splice(idx,1);save();render();};
    btns.append(edit,del);d.append(name,btns);list.appendChild(d);
  });
}
function render(){ $('count').textContent=data.items.length+' 間'; $('lastPick').textContent=data.last||'未轉過'; renderGrid(); renderList(); }
function jump(){
  if(jumping||data.items.length===0) return;
  jumping=true; $('spin').disabled=true;
  const n=data.items.length;
  const finalIdx=Math.floor(Math.random()*n);
  const totalSteps= n*4 + Math.floor(Math.random()*n) + finalIdx;
  let step=0;
  let delay=70;
  function tick(){
    const cur=step % n;
    renderGrid(cur, -1);
    if(step>=totalSteps){
      renderGrid(cur, cur);
      data.last=data.items[cur];
      document.getElementById('result').innerHTML='<b>'+data.items[cur]+'</b><i>就食呢間！</i>';
      $('count').textContent=n+' 間';
      $('lastPick').textContent=data.items[cur];
      save();
      jumping=false; $('spin').disabled=false;
      setTimeout(()=>renderGrid(-1, cur), 2000);
      return;
    }
    step++;
    const progress=step/totalSteps;
    if(progress>0.6) delay+= (progress-0.6)*8;
    if(progress>0.85) delay+=10;
    setTimeout(tick, delay);
  }
  tick();
}
$('spin').onclick=jump;
$('add').onclick=()=>{const v=$('name').value.trim();if(!v)return;data.items.push(v);$('name').value='';save();render();};
$('export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='restaurant-roulette.json';a.click();URL.revokeObjectURL(u);};
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render();}catch{alert('格式唔啱')}};r.readAsText(f);};
$('clear').onclick=()=>{if(data.items.length===0)return;data.items=[];data.last=null;$('result').innerHTML='<i>已清空，新增幾間先跳得</i>';save();render();};
